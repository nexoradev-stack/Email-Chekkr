<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Email Chekkr — Email verification</title>
  <desc id="d">Check every email before you send. A blue globe with a tick, circled by orbit rings, with results marked valid, risky and invalid.</desc>
  <defs>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#3952FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3952FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#A9B5FF"/>
      <stop offset="0.45" stop-color="#3952FF"/>
      <stop offset="1" stop-color="#18237E"/>
    </radialGradient>
    <radialGradient id="logo" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#9AA8FF"/>
      <stop offset="0.45" stop-color="#3952FF"/>
      <stop offset="1" stop-color="#18237E"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="968" cy="180" r="92"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="28" fill="#040A18"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- Logo + wordmark -->
  <g transform="translate(80 92)">
    <rect width="56" height="56" rx="14" fill="#040A18" stroke="#B3C5D0" stroke-opacity="0.25"/>
    <circle cx="28" cy="28" r="16.6" fill="url(#logo)"/>
    <path d="M21.4 28.4l4.8 4.8 8.8-9.6" fill="none" stroke="#FFFDF9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FFFDF9">
    <text x="152" y="134" font-size="40" font-weight="400" letter-spacing="-1">Email <tspan font-weight="500">Chekkr</tspan></text>
    <text x="80" y="214" font-size="46" font-weight="500" letter-spacing="-1.6">Check every email</text>
    <text x="80" y="266" font-size="46" font-weight="500" letter-spacing="-1.6" fill="#9AA8FF">before you send.</text>
  </g>
  <text x="80" y="312" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2" fill="#B3C5D0">FORMAT · DOMAIN · MAIL SERVER · TEMP INBOX · TEAM ADDRESS · TYPOS</text>

  <!-- Globe -->
  <ellipse cx="968" cy="180" rx="200" ry="52" fill="none" stroke="#B3C5D0" stroke-opacity="0.22" transform="rotate(-8 968 180)"/>
  <circle cx="968" cy="180" r="92" fill="url(#sphere)"/>
  <g clip-path="url(#ball)" stroke="#FFFDF9" stroke-opacity="0.16" fill="none">
    <ellipse cx="968" cy="180" rx="30" ry="92"/><ellipse cx="968" cy="180" rx="62" ry="92"/>
    <path d="M876 150h184M876 180h184M876 210h184"/>
  </g>
  <path d="M934 182l24 24 46-50" fill="none" stroke="#FFFDF9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="968" cy="180" rx="150" ry="36" fill="none" stroke="#3952FF" stroke-width="1.5" transform="rotate(12 968 180)"/>
  <circle cx="1114" cy="210" r="6" fill="#3952FF"/>

  <!-- Result chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFDF9">
    <rect x="700" y="60" width="164" height="34" rx="10" fill="#FFFDF9" fill-opacity="0.07" stroke="#B3C5D0" stroke-opacity="0.2"/>
    <circle cx="718" cy="77" r="4" fill="#5BD69B"/><text x="730" y="82">anna@… · Valid</text>
    <rect x="1066" y="80" width="150" height="34" rx="10" fill="#FFFDF9" fill-opacity="0.07" stroke="#B3C5D0" stroke-opacity="0.2"/>
    <circle cx="1084" cy="97" r="4" fill="#F5B74A"/><text x="1096" y="102">gmial.com · Typo</text>
    <rect x="1032" y="262" width="184" height="34" rx="10" fill="#FFFDF9" fill-opacity="0.07" stroke="#B3C5D0" stroke-opacity="0.2"/>
    <circle cx="1050" cy="279" r="4" fill="#FF8A8A"/><text x="1062" y="284">nowhere.zzz · Invalid</text>
  </g>
</svg>
