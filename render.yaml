# Email Chekkr API — Render Blueprint (free plan works).
# In Render: New → Blueprint → pick this repository. Render builds the Dockerfile and gives you an https://….onrender.com address.
# Nothing here deploys by itself.

services:
  - type: web
    name: email-chekkr-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: EMAIL_CHEKKR_PUBLIC_ACCESS
        value: "true"
      - key: EMAIL_CHEKKR_CORS_ORIGINS
        value: https://nexoradev-stack.github.io
      - key: EMAIL_CHEKKR_PUBLIC_RATE_LIMIT
        value: "30"
      - key: EMAIL_CHEKKR_PUBLIC_BATCH_MAX
        value: "50"
      - key: EMAIL_CHEKKR_KEY_RATE_LIMIT
        value: "120"
      - key: EMAIL_CHEKKR_KEY_BATCH_MAX
        value: "500"
      - key: EMAIL_CHEKKR_DNS_SERVERS
        value: 1.1.1.1,8.8.8.8
      # One API key is generated for you; see it under Environment in Render. Add more separated by commas.
      - key: EMAIL_CHEKKR_API_KEYS
        generateValue: true
